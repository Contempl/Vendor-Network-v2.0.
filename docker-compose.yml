version: '3.8'

services:
  db:
    image: postgres:16
    restart: always
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=mydb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: Product.WebApi/Dockerfile
    restart: always
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_USER: user
      DB_PASSWORD: password
      DB_NAME: mydb
    
    
  seeder:
    build:
      context: .
      dockerfile: Product.WebApi/Dockerfile
    depends_on:
      - db
    restart: "no"
    command: ["dotnet", "Product.Seeder.dll"]

volumes:
  pgdata:
