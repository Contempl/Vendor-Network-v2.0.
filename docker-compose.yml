version: '3.8'

services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: src/Product.WebApi/Dockerfile
    restart: always
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER} 
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    
    
  seeder:
    build:
      context: .
      dockerfile: Product.WebApi/Dockerfile
    depends_on:
      - db
    restart: "no"
    command: ["dotnet", "Product.Seeder.dll"]

volumes:
  pgdata:
