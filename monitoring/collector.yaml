receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  transform/privacy:
    error_mode: ignore
    trace_statements:
      - context: spanevent
        statements:
          - delete_key(spanevent.attributes, "exception.message")
          - delete_key(spanevent.attributes, "exception.stacktrace")
  batch:
    timeout: 5s
    send_batch_size: 512
exporters:
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    sending_queue:
      queue_size: 1000
    retry_on_failure:
      enabled: true
      max_elapsed_time: 60s
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_constant_labels:
      included:
        - service.name
        - service.instance.id
        - service.version
        - deployment.environment.name
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/privacy, batch]
      exporters: [otlp_grpc/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
