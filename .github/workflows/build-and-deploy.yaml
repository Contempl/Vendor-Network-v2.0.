name: Continuous Integration and Deployment

on:
  pull_request:
    branches: 
      - development
  
  
  
jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          
      - name: Restore dependencies
        run: dotnet restore src/Project.sln

      - name: Restore EF Core tools
        run: dotnet tool restore
        
      - name: Build solution
        run: dotnet build src/Project.sln --configuration Release --no-restore

      - name: Check migration snapshot
        working-directory: src/Product.WebApi
        run: dotnet ef migrations has-pending-model-changes --project ../Product.Infrastructure/Product.Infrastructure.csproj --startup-project Product.WebApi.csproj --configuration Release --no-build
          
      - name: Run tests
        run: dotnet test src/Project.sln --no-build --configuration Release --verbosity normal
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build Docker image
        run: docker build -t src/product-api:latest .

      - name: Build migration and seeder image
        run: docker build --target seeder -t src/product-seeder:latest .

      - name: Save images for monitoring smoke test
        run: |
          mkdir -p .local/ci-images
          docker save src/product-api:latest src/product-seeder:latest | gzip > .local/ci-images/images.tar.gz

      - name: Upload smoke test images
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-images
          path: .local/ci-images/images.tar.gz
          include-hidden-files: true
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  monitoring:
    name: Monitoring smoke test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download built images
        uses: actions/download-artifact@v4
        with:
          name: monitoring-images
          path: .local/ci-images

      - name: Load built images
        run: docker load --input .local/ci-images/images.tar.gz

      - name: Validate configuration and test telemetry delivery
        run: python3 -u scripts/ci/monitoring-smoke.py

      - name: Upload monitoring diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-diagnostics
          path: |
            .local/monitoring-ci/status.txt
            .local/monitoring-ci/compose.log
            .local/monitoring-ci/result.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore
