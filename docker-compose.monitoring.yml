x-logging: &rotating-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    compress: "true"

services:
  api:
    environment:
      Observability__Enabled: "true"
      Observability__TraceSamplingRatio: ${TRACE_SAMPLING_RATIO:-1.0}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_METRIC_EXPORT_INTERVAL: "10000"
  otel-collector:
    logging: *rotating-logs
    image: otel/opentelemetry-collector-contrib:0.162.0-${COLLECTOR_ARCH:-amd64}
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./monitoring/collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:${OTLP_GRPC_HOST_PORT:-4317}:4317"
      - "127.0.0.1:${OTLP_HTTP_HOST_PORT:-4318}:4318"
    depends_on: [tempo]
  prometheus:
    logging: *rotating-logs
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
      - "--storage.tsdb.retention.time=7d"
      - "--storage.tsdb.retention.size=2GB"
    volumes:
      - ./monitoring/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"]
  tempo:
    logging: *rotating-logs
    image: grafana/tempo:3.1.0
    restart: unless-stopped
    command: ["-target=all", "-config.file=/etc/tempo.yaml"]
    volumes:
      - ./monitoring/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
  grafana:
    logging: *rotating-logs
    image: grafana/grafana:13.2.3
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:${GRAFANA_HOST_PORT:-3001}:3000"]
    depends_on: [prometheus, tempo]
volumes:
  prometheus-data:
  tempo-data:
  grafana-data:
